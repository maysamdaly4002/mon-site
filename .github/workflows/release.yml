name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Incrément de version'
        required: true
        type: choice
        options: [patch, minor, major]
        default: minor

permissions:
  contents: write

jobs:
  tag-from-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm version "$BUMP" -m 'chore(release): %s'
          git push origin HEAD:main --follow-tags

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          npm ci --no-audit --no-fund --legacy-peer-deps
          npm run build
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "snapify-${VERSION}.tar.gz" dist package.json package-lock.json scripts/deploy.sh README.md CHANGELOG.md
          sha256sum "snapify-${VERSION}.tar.gz" > "snapify-${VERSION}.tar.gz.sha256"
      - run: |
          python3 - <<'PY'
          import pathlib, os, re
          ver = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"## \[{re.escape(ver)}\][\s\S]*?(?=\n## |\Z)", text)
          pathlib.Path("release-notes.md").write_text((m.group(0).strip() if m else f"Release Snapify v{ver}") + "\n", encoding="utf-8")
          PY
      - uses: softprops/action-gh-release@v2
        with:
          name: Snapify ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            snapify-*.tar.gz
            snapify-*.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: false
