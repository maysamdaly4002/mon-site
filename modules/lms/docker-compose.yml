services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: lms, POSTGRES_PASSWORD: lms, POSTGRES_DB: lms }
    ports: ["5432:5432"]
    volumes: ["lms-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API autonome : docker compose --profile api up -d --build   (définir LMS_JWT_SECRET dans l'environnement ou un fichier .env)
  api:
    profiles: ["api"]
    build: .
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://lms:lms@db:5432/lms
      LMS_JWT_SECRET: ${LMS_JWT_SECRET:-}  # obligatoire, 32 caractères minimum (sinon l'API refuse de démarrer)
      LMS_ORGANISATION: ${LMS_ORGANISATION:-}
      LMS_SIGNATORY: ${LMS_SIGNATORY:-}
      LMS_VERIFY_URL: ${LMS_VERIFY_URL:-}
    ports: ["3000:3000"]
    restart: unless-stopped

volumes:
  lms-data:
