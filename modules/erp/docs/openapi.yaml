        '400': { description: Validation }
        '401': { description: Non authentifié }
        '403': { description: Droits ou périmètre insuffisants }
        '404': { description: Introuvable }
        '409': { description: Conflit métier }
  /users/add:
    post:
      summary: "Crée un utilisateur (admin)"
      tags: [users]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, nom, role, password]
              properties:
                email: { description: "email" }
                nom: { description: "nom" }
                role: { description: "role (admin|exploitant|technicien|auditeur)" }
                password: { description: "password" }
                etablissementIds: { description: "etablissementIds[]" }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
